<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>CineSync - Sala de Cinema Virtual</title>
    <style>
        :root {
            --bg-main: #101218;
            --bg-sidebar: #0f0f0f;
            --accent: #E50914;
            --accent-hover: #b91c1c;
            --second-accent: #6366F1;
            --text-main: #f4f4f5;
            --text-dim: #a1a1aa;
            --border: #252a2e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html,
        body {
            touch-action: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            position: relative;
            width: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-icon {
            margin-right: 19px;
        }

        .sync-icon {
            position: absolute;
            bottom: 0;
            right: 9px;
            fill: #fb343e;
        }

        .logo-text {
            font-size: 1rem;
            font-weight: 600;
        }

        #room-id {
            text-transform: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-badge {
            background: rgba(39, 39, 42, 0.5);
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .icon-btn {
            background: #27272a;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn.active {
            background: var(--accent);
        }

        /* Main Content */
        main {
            min-height: 0;
            flex: 1;
            display: flex;
        }

        .left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .player-section {
            min-height: 0;
            flex: 1;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            min-height: 0;
            flex: 1;
            object-fit: contain;
        }

        /* Video Controls */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .player-controls {
            z-index: 99;
            position: absolute;
            bottom: 0;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: max(15px, calc(env(safe-area-inset-left) / 1.5));
            padding-right: max(15px, calc(env(safe-area-inset-right) / 1.5));
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .player-section:hover .player-controls {
            opacity: 1;
        }

        /* OVERLAY DE PROGRESSO DE TRANSFERÊNCIA DE VÍDEO */
        .transfer-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .transfer-card {
            background: #18181b;
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 12px;
            width: 85%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .transfer-card h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
            word-break: break-all;
        }

        .progress-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #27272a;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.15s ease-out;
        }

        /* Lista de Clientes para o Host */
        .client-progress-section {
            width: 100%;
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
            margin-top: 0.25rem;
        }

        .client-progress-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        .client-progress-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .client-progress-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .completed-msg {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            width: 100%;
            margin-top: 0.25rem;
        }

        .play-pause-btn,
        .sound-btn,
        .pip-btn,
        .full-screen-btn {
            border: none;
            background: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .time-display {
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
        }

        #progressRange {
            flex: 1;
            height: 6px;
            cursor: pointer;
            background: #444;
            border-radius: 3px;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
        }

        #progressRange::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            background: white;
            cursor: pointer;
        }

        #progressRange::-moz-range-thumb {
            width: 10px;
            height: 10px;
            background: white;
            border: none;
            cursor: pointer;
        }

        .pip-btn {
            margin-left: auto;
        }

        .controls-row {
            width: 100%;
            padding: 10px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .controls-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-group {
            background: rgba(39, 39, 42, 0.8);
            backdrop-filter: blur(8px);
            padding: 4px;
            border-radius: 8px;
            display: flex;
            border: 1px solid var(--border);
        }

        .text-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 0.5rem 0.75rem;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .text-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Sidebar Chat */
        .chat-sidebar {
            width: 20%;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            display: none;
            transition: transform 0.3s ease;
        }

        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .message.mine {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-info {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .msg-bubble {
            background: #27272a;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            border-top-left-radius: 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .mine .msg-bubble {
            background: var(--accent);
            color: white;
            border-top-left-radius: 1rem;
            border-top-right-radius: 0;
        }

        .chat-input-area {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            background: var(--bg-main);
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            background: #18181b;
            border: 1px solid var(--border);
            padding: 0.8rem 3rem 0.8rem 1rem;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
        }

        input[type="text"]:focus {
            outline: 2px solid rgba(220, 38, 38, 0.5);
        }

        .send-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
        }

        .new-message-toast {
            z-index: 999;
            position: absolute;
            bottom: 150px;
            right: 20px;
            border-radius: 10px;
            padding: 20px;
            background: linear-gradient(to top, #000, #00000087);
        }

        .new-message-toast h2 {
            font-size: 16px;
        }

        .modal-overlay {
            z-index: 10000;
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .modal-content h2 {
            margin-bottom: 10px;
        }

        .modal-content {
            position: relative;
            background: #18181b;
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 12px;
            width: 50%;
            color: white;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .modal-content form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .modal-content form input {
            border: 1px solid var(--border);
            background: #18181b;
            padding: 1rem;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
        }

        .modal-content form button {
            border: 1px solid var(--border);
            background: var(--accent);
            padding: 0.8rem;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .chat-sidebar.open {
            transform: translateY(0);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 1024px) {
            .chat-sidebar {
                position: absolute;
                inset: 0;
                width: 100%;
                z-index: 50;
                transform: translateY(100%);
            }
        }

        .hidden {
            display: none !important;
        }

        .room-id {
            margin-right: auto;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>

<body>

    <header>
        <div>
            <div class="logo-container">
                <svg class="logo-icon" width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
                    <line x1="8" y1="21" x2="16" y2="21" />
                    <line x1="12" y1="17" x2="12" y2="21" />
                </svg>
                <svg class="sync-icon" width="20" height="20" viewBox="0 0 52 52" fill="currentColor">
                    <path
                        d="M47.9 29.3c0-.8-.7-1.5-1.5-1.5h-3.5c-.8 0-1.4.6-1.4 1.4 0 .2 0 .5-.1.7-.3 1.3-.8 2.5-1.5 3.7-2.8 4.9-7.7 7.6-12.9 7.6-4 0-7.8-1.6-10.6-4.4-.5-.4-.9-.9-1.2-1.4-.3-.8.4-1.2 1.3-1.2h7c.8 0 1.5-.7 1.5-1.5v-3.1c0-.8-.6-1.4-1.4-1.4H5.3c-.7 0-1.3.6-1.3 1.3v18.2c.1.8.8 1.5 1.6 1.5h3c.8 0 1.5-.7 1.5-1.5v-7c0-.9.5-1.3 1.2-.7.3.4.6.7 1 1 5 5 12 7.1 19.2 5.7 2.5-.5 4.9-1.5 7-2.9 5.2-3.4 8.5-8.6 9.4-14.3zM4.1 22.7c0 .8.7 1.5 1.5 1.5h3.5c.8 0 1.4-.6 1.4-1.4 0-.2 0-.5.1-.7.3-1.3.8-2.5 1.5-3.7 2.8-4.9 7.7-7.6 12.9-7.6 4 0 7.8 1.6 10.6 4.4.5.4.9.9 1.2 1.4.3.8-.4 1.2-1.3 1.2h-7c-.8 0-1.5.7-1.5 1.5v3.1c0 .8.6 1.4 1.4 1.4h18.3c.7 0 1.3-.6 1.3-1.3V4.3c-.1-.8-.8-1.5-1.6-1.5h-3c-.8 0-1.5.7-1.5 1.5v7c0 .9-.5 1.3-1.2.7-.3-.4-.6-.7-1-1-5-5-12-7.1-19.2-5.7-2.5.5-4.9 1.5-7 2.9-5.2 3.4-8.5 8.6-9.4 14.3z" />
                </svg>
            </div>
            <h1 class="logo-text">CineSync</h1>
        </div>

        <div class="header-actions">
            <div class="status-badge hidden">
                <span class="status-dot"></span>
                <span id="online-count"></span>
            </div>
            <button class="icon-btn" id="mic-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                    <line x1="12" y1="19" x2="12" y2="23" />
                    <line x1="8" y1="23" x2="16" y2="23" />
                </svg>
            </button>
            <button class="icon-btn" id="chat-toggle-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
            </button>
        </div>
    </header>

    <main>
        <div class="left-column">
            <div class="player-section" id="player-container">
                <video playsinline webkit-playsinline id="main-video"></video>

                <!-- Overlay de Progresso da Transferência -->
                <div class="transfer-overlay hidden" id="transfer-overlay">
                    <div class="transfer-card">
                        <h3 id="transfer-title">Transferindo arquivo...</h3>

                        <!-- Progresso do Host/Local -->
                        <div class="progress-group">
                            <div class="progress-label">
                                <span id="local-progress-title">Seu Envio (Host)</span>
                                <span id="transfer-percent">0%</span>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" id="transfer-bar"></div>
                            </div>
                        </div>

                        <!-- Lista de Clientes (Visível apenas para o Host) -->
                        <div class="client-progress-section hidden" id="host-clients-progress">
                            <div class="client-progress-title">Download dos Clientes:</div>
                            <div class="client-progress-list" id="client-progress-list"></div>
                        </div>

                        <!-- Mensagem de Conclusão Total -->
                        <div class="completed-msg hidden" id="all-completed-msg">
                            ✓ Todos os clientes baixaram o vídeo!
                        </div>
                    </div>
                </div>

                <div class="player-controls">
                    <button class="play-pause-btn hidden" title="Play/Pause">
                        <svg class="play-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 210 210" fill="white">
                            <path d="M179.07 105 30.93 210V0z" />
                        </svg>
                        <svg class="pause-icon hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 512 512" fill="white">
                            <path d="M0 20.885h188.088v470.23H0zm323.912 0H512v470.23H323.912z" />
                        </svg>
                    </button>
                    <button class="sound-btn">
                        <svg class="sound-on-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 512 512" fill="white">
                            <path
                                d="M426.7 256c0-71-43.4-131.8-105-157.5l-16.4 39.4C351.5 157.2 384 202.8 384 256c0 53.3-32.5 98.8-78.8 118.1l16.4 39.4C383.3 387.8 426.7 327 426.7 256m-85.4 0c0-35.5-21.7-65.9-52.5-78.7l-16.4 39.4c15.4 6.4 26.2 21.6 26.2 39.4 0 17.7-10.8 32.9-26.2 39.4l16.4 39.4c30.8-13 52.5-43.4 52.5-78.9m13.2-236.3L338 59.1C415.1 91.2 469.3 167.2 469.3 256c0 88.7-54.2 164.8-131.3 196.9l16.4 39.4C447 453.7 512 362.5 512 256S447 58.3 354.5 19.7M0 149.3v213.3h85.3L234.7 512V0L85.3 149.3z" />
                        </svg>
                        <svg class="sound-off-icon hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 256 512" fill="white">
                            <path d="M0 149.3v213.3h85.3L234.7 512V0L85.3 149.3z" />
                        </svg>
                    </button>
                    <div class="time-display">
                        <span id="current-time">0:00</span> | <span id="duration">0:00</span>
                    </div>
                    <input class="hidden" type="range" id="progressRange" min="0" max="0" value="0" step="0.1">
                    <button class="pip-btn" title="Picture in Picture">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16">
                            <path
                                d="M1.5 2A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2zm7 6h5a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5h-5a.5.5 0 0 1-.5-.5v-3a.5.5 0 0 1 .5-.5"
                                style="fill: white;" />
                        </svg>
                    </button>
                    <button class="full-screen-btn">
                        <svg class="full-screen-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 16 16">
                            <path
                                d="M10 15h5v-5h-1.8v3.2H10zm-4 0v-1.8H2.8V10H1v5zm4-12.2h3.2V6H15V1h-5zM6 1v1.8H2.8V6H1V1z"
                                fill="white" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="controls-row">
                <p class="room-id hidden">Sala <span id="room-id"></span></p>
                <div class="controls-right">
                    <div class="btn-group">
                        <button class="text-btn" id="url-btn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                            </svg>
                            URL
                        </button>
                        <label class="text-btn" style="cursor:pointer">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                                <circle cx="12" cy="13" r="4" />
                            </svg>
                            ARQUIVO
                            <input type="file" id="file-input" class="hidden" accept="video/*">
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <aside class="chat-sidebar" id="sidebar">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:0.5rem">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    <span style="font-weight:700">Chat ao vivo</span>
                </div>
                <button class="icon-btn" id="close-chat-btn" style="background:transparent">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="messages-container" id="messages"></div>

            <div class="chat-input-area">
                <form id="chat-form">
                    <div class="input-wrapper">
                        <input type="text" id="chat-input" placeholder="Escreve algo...">
                        <button type="submit" class="send-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <line x1="22" y1="2" x2="11" y2="13" />
                                <polygon points="22 2 15 22 11 13 2 9 22 2" />
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </aside>
    </main>

    <div class="new-message-toast hidden" id="messageToast">
        <h2 id="toastUsername"></h2>
        <p id="toastMessage"></p>
    </div>

    <div class="modal-overlay hidden">
        <div class="modal-content">
            <button class="icon-btn close-btn" style="background:transparent;justify-self: flex-end;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2>URL do vídeo</h2>
            <form id="video-form">
                <input type="text" id="video-url" name="video_url" placeholder="Digite o URL do vídeo" required>
                <button type="submit">Salvar</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay hidden" id="username-modal">
        <div class="modal-content">
            <button class="icon-btn close-btn" style="background:transparent;justify-self: flex-end;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2>Seu nome</h2>
            <form id="username-form">
                <input type="text" id="username" name="username" placeholder="Digite seu nome" required>
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay hidden" id="error-modal">
        <div class="modal-content">
            <button class="icon-btn close-btn" style="background:transparent;justify-self: flex-end;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2>Erro</h2>
            <p id="error-message"></p>
            <button id="error-ok">OK</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const header = document.querySelector('header');
            const roomIdElement = document.getElementById('room-id');
            const video = document.getElementById('main-video');
            const playerControls = document.querySelector('.player-controls');
            const playIcons = document.querySelectorAll('.play-icon');
            const pauseIcons = document.querySelectorAll('.pause-icon');
            const playPauseBtn = document.querySelector('.play-pause-btn');
            const soundBtn = document.querySelector('.sound-btn');
            const currentTime = document.getElementById('current-time');
            const duration = document.getElementById('duration');
            const progressRange = document.getElementById('progressRange');
            const controlsRow = document.querySelector('.controls-row');
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            const messagesContainer = document.getElementById('messages');
            const sidebar = document.getElementById('sidebar');
            const urlBtn = document.getElementById('url-btn');
            const fileInput = document.getElementById('file-input');
            const statusBadge = document.querySelector('.status-badge');
            const onlineCountEl = document.getElementById('online-count');
            const modal = document.querySelector('.modal-overlay');
            const usernameModal = document.getElementById('username-modal');
            const errorModal = document.getElementById('error-modal');
            const errorMessage = document.getElementById('error-message');
            const videoForm = document.getElementById('video-form');
            const usernameForm = document.getElementById('username-form');

            // Overlay de Progresso
            const transferOverlay = document.getElementById('transfer-overlay');
            const transferTitle = document.getElementById('transfer-title');
            const localProgressTitle = document.getElementById('local-progress-title');
            const transferBar = document.getElementById('transfer-bar');
            const transferPercent = document.getElementById('transfer-percent');
            const hostClientsProgressSection = document.getElementById('host-clients-progress');
            const clientProgressList = document.getElementById('client-progress-list');
            const allCompletedMsg = document.getElementById('all-completed-msg');

            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('roomId');
            const mode = urlParams.get('mode') || 'client';
            let username = sessionStorage.getItem('username') || 'Anônimo';

            let isHost = false;
            let syncWithHost = true;

            let peer = null;
            let conn = null;
            let clientsConn = [];
            let activeCalls = [];
            let localStream = null;
            let receivedChunks = [];
            let incomingMeta = null;
            let receivedBytes = 0;
            let clientProgressState = {}; // Guarda o progresso dos clientes para o Host

            // Variáveis globais para gerenciar o áudio
            let silentStream = null;

            // Função que roda DENTRO do evento do Modal (Gesto Válido do iOS)
            function initAudioSystem() {
                if (audioCtx) return;

                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass({ sampleRate: 48000 });
                audioCtx.resume();

                // Oscilador com ganho zero (silêncio real com track WebRTC ativa)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                gain.gain.value = 0;

                osc.connect(gain);
                const dst = audioCtx.createMediaStreamDestination();
                gain.connect(dst);
                osc.start();

                const silentTrack = dst.stream.getAudioTracks()[0];
                silentTrack.enabled = true; // Mantém a faixa ativa para o iOS não cortar a transmissão
                silentStream = new MediaStream([silentTrack]);
            }

            function appendMessage(sender, text) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';

                const msgInfo = document.createElement('span');
                msgInfo.className = 'msg-info';
                msgInfo.textContent = `${sender} • ${time}`;

                const msgBubble = document.createElement('div');
                msgBubble.className = 'msg-bubble';
                msgBubble.textContent = text;

                messageDiv.appendChild(msgInfo);
                messageDiv.appendChild(msgBubble);
                messagesContainer.appendChild(messageDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                if (sidebar.classList.contains('open')) return;

                document.getElementById('toastUsername').textContent = sender;
                document.getElementById('toastMessage').textContent = text;
                messageToast.classList.remove('hidden');

                setTimeout(() => {
                    messageToast.classList.add('hidden');
                }, 10000);
            }

            if (mode === "client") {
                usernameModal.classList.remove('hidden');
                controlsRow.remove();

                if (username !== 'Anônimo') {
                    document.getElementById('username').value = username;
                }

                usernameForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    username = document.getElementById('username').value.trim();
                    if (username) {
                        sessionStorage.setItem('username', username);
                        usernameModal.remove();
                        document.querySelector('.full-screen-btn').classList.remove('hidden');
                        initAudioSystem();
                        unlockAudioContextOnGesture();
                        initAsClient();
                    }
                });
            } else {
                initAsHost();
            }

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const message = chatInput.value.trim();
                if (message) {
                    appendMessage(username, message);
                    sendToAllClients({ type: 'chat-message', sender: username, text: message });
                    if (conn) {
                        conn.send({ type: 'chat-message', sender: username, text: message });
                    }
                    chatInput.value = '';
                }
            });

            videoForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = new FormData(videoForm);
                const videoUrl = formData.get('video_url');
                if (!videoUrl) return;

                const youtubeId = getYouTubeId(videoUrl);

                if (youtubeId) {
                    if (!window.YT) {
                        const tag = document.createElement('script');
                        tag.src = "https://www.youtube.com/iframe_api";
                        const firstScriptTag = document.getElementsByTagName('script')[0];
                        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

                        window.onYouTubeIframeAPIReady = function () {
                            inicializarPlayerYouTube(youtubeId);
                        };
                    } else {
                        inicializarPlayerYouTube(youtubeId);
                    }

                    modal.classList.add('hidden');
                    sendToAllClients({ type: 'video-changed', provider: 'youtube', id: youtubeId });
                    return;
                }

                video.src = videoUrl;
                modal.classList.add('hidden');
                sendToAllClients({ type: 'video-changed', provider: 'direct', url: videoUrl });
            });

            // ==========================================
            // ENVIO DE ARQUIVO VÍDEO COM CONTROLE DE FLUXO (BACKPRESSURE)
            // ==========================================
            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // 1. Player do Host carrega o arquivo localmente
                const videoUrl = URL.createObjectURL(file);
                video.src = videoUrl;
                video.load();

                // 2. Prepara o Overlay do Host
                transferTitle.textContent = `Enviando "${file.name}"...`;
                localProgressTitle.textContent = "Seu Envio (Host)";
                transferBar.style.width = '0%';
                transferPercent.textContent = '0%';
                allCompletedMsg.classList.add('hidden');
                clientProgressList.innerHTML = '';
                clientProgressState = {};

                if (clientsConn.length > 0) {
                    hostClientsProgressSection.classList.remove('hidden');
                    clientsConn.forEach(c => {
                        const clientName = c.customUsername || `Cliente (${c.peer.substring(0, 4)})`;
                        clientProgressState[c.peer] = { percent: 0, done: false };

                        const clientItem = document.createElement('div');
                        clientItem.className = 'client-progress-item';
                        clientItem.id = `client-item-${c.peer}`;
                        clientItem.innerHTML = `
                <div class="progress-label">
                    <span>${clientName}</span>
                    <span id="client-percent-${c.peer}">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="client-bar-${c.peer}"></div>
                </div>
            `;
                        clientProgressList.appendChild(clientItem);
                    });
                } else {
                    hostClientsProgressSection.classList.add('hidden');
                }

                transferOverlay.classList.remove('hidden');

                // 3. Notifica os clientes sobre o início do envio
                sendToAllClients({
                    type: 'video-meta',
                    name: file.name,
                    size: file.size,
                    mimeType: file.type
                });

                // Aumentamos o chunk para 256KB (ideal para arquivos de 100MB+)
                const CHUNK_SIZE = 256 * 1024;
                const MAX_BUFFERED_AMOUNT = 2 * 1024 * 1024; // 2MB de limite de buffer
                let offset = 0;
                const reader = new FileReader();

                const readNextChunk = () => {
                    let isBufferFull = false;
                    clientsConn.forEach(clientConn => {
                        const dc = clientConn.dataChannel || clientConn._dc;
                        if (dc && dc.bufferedAmount > MAX_BUFFERED_AMOUNT) {
                            isBufferFull = true;
                        }
                    });

                    if (isBufferFull) {
                        setTimeout(readNextChunk, 10);
                        return;
                    }

                    const slice = file.slice(offset, offset + CHUNK_SIZE);
                    reader.readAsArrayBuffer(slice);
                };

                reader.onload = (event) => {
                    const buffer = event.target.result;

                    // ENVIO DIRETO DO ARRAYBUFFER (SEM OBJETO JS ENVOLVENDO)
                    clientsConn.forEach(clientConn => {
                        if (clientConn.open) {
                            clientConn.send(buffer);
                        }
                    });

                    offset += buffer.byteLength;

                    const percent = Math.min(100, Math.floor((offset / file.size) * 100));
                    transferBar.style.width = `${percent}%`;
                    transferPercent.textContent = `${percent}%`;

                    if (offset < file.size) {
                        setTimeout(readNextChunk, 1);
                    } else {
                        // Não precisamos mais do 'video-end', a recepção detecta pelo tamanho total de bytes
                        if (clientsConn.length === 0) {
                            setTimeout(() => transferOverlay.classList.add('hidden'), 800);
                        }
                    }
                };

                readNextChunk();
            };

            const audioConstraints = {
                audio: {
                    echoCancellation: true,   // Mantém para evitar microfonia no mobile
                    noiseSuppression: true,   // Remove ruídos de fundo
                    autoGainControl: true,    // Evita oscilações bruscas no volume
                    sampleRate: 48000,        // Qualidade de estúdio (48 kHz)
                    sampleSize: 16,
                    channelCount: 1           // 1 para voz limpa (Mono) ou 2 se quiser enviar áudio Stereo
                }
            };

            function optimizeAudioSDP(sdp) {
                // Força o Opus a operar em 96 kbps (96000) com Forward Error Correction (fec)
                if (sdp.includes('opus/48000')) {
                    return sdp.replace(
                        'useinbandfec=1',
                        'useinbandfec=1;maxaveragebitrate=96000;stereo=1;sprop-stereo=1'
                    );
                }
                return sdp;
            }

            document.body.addEventListener('click', async (event) => {
                const target = event.target;

                if (target.closest('#mic-btn')) {
                    const micBtn = document.getElementById('mic-btn');
                    initAudioSystem();

                    if (!localStream) {
                        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                            alert("No iOS, o microfone exige conexão HTTPS.");
                            return;
                        }

                        try {
                            // Pega o microfone real
                            try {
                                localStream = await navigator.mediaDevices.getUserMedia(audioConstraints);
                            } catch (err) {
                                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            }

                            micBtn.classList.add('active');

                            const realTrack = localStream.getAudioTracks()[0];

                            // Substitui a faixa silenciosa pela faixa real do mic em todas as conexões ativas
                            activeCalls.forEach(call => {
                                const senders = call.peerConnection.getSenders();
                                const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
                                if (audioSender) {
                                    audioSender.replaceTrack(realTrack);
                                }
                            });

                            // Se for novo participante na sala, estabelece chamadas Mesh com os demais
                            const targetsToCall = isHost ? clientsConn.map(c => c.peer) : roomPeers;
                            targetsToCall.forEach(peerId => {
                                if (peerId !== peer.id && !activeCalls.some(c => c.peer === peerId)) {
                                    const call = peer.call(peerId, localStream);
                                    setupAudioCall(call);
                                }
                            });

                        } catch (error) {
                            console.error('Erro ao acessar o microfone:', error);
                            alert("Não foi possível acessar o microfone.");
                        }
                        return;
                    }

                    // Se já tinha a localStream capturada, apenas alterna Mute / Unmute
                    const audioTrack = localStream.getAudioTracks()[0];
                    if (audioTrack) {
                        audioTrack.enabled = !audioTrack.enabled;
                        micBtn.classList.toggle('active', audioTrack.enabled);
                    }
                    return;
                }

                if (target.closest('#chat-toggle-btn') || target.closest('#close-chat-btn')) {
                    sidebar.classList.toggle('open');
                    return;
                }

                if (target.closest('#messageToast')) {
                    sidebar.classList.add('open');
                    document.getElementById('messageToast').classList.add('hidden');
                    return;
                }

                if (target.closest('.full-screen-btn')) {
                    header.classList.toggle('hidden');
                    if (controlsRow) {
                        controlsRow.classList.toggle('hidden');
                    }
                    alternarTelaCheia();
                    return;
                }

                if (target.closest('.sound-btn')) {
                    if (!video.src) return;
                    video.muted = !video.muted;

                    const soundOnIcon = document.querySelector('.sound-on-icon');
                    const soundOffIcon = document.querySelector('.sound-off-icon');

                    if (video.muted) {
                        soundOnIcon.classList.add('hidden');
                        soundOffIcon.classList.remove('hidden');
                    } else {
                        soundOnIcon.classList.remove('hidden');
                        soundOffIcon.classList.add('hidden');
                    }
                    return;
                }

                if (target.closest('.pip-btn')) {
                    if (!video.src) return;
                    try {
                        if (video.requestPictureInPicture) {
                            if (document.pictureInPictureElement) {
                                await document.exitPictureInPicture();
                            } else {
                                await video.requestPictureInPicture();
                            }
                        }
                    } catch (error) {
                        console.error("Erro ao alternar PiP:", error);
                    }
                    return;
                }

                if (target.closest('.modal-overlay .close-btn')) {
                    modal.classList.add('hidden');
                    return;
                }

                if (!isHost && syncWithHost) return;

                if (target.closest('.play-pause-btn')) {
                    if (!video.src) return;
                    video.paused ? video.play() : video.pause();
                    return;
                }

                if (target.closest('#url-btn')) {
                    modal.classList.remove('hidden');
                    return;
                }
            });

            function alternarTelaCheia() {
                const elem = document.documentElement;

                if (!document.fullscreenElement) {
                    elem.requestFullscreen().catch((err) => {
                        console.error(`Erro ao ativar tela cheia: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            }

            function sendVideoState() {
                if (!isHost) return;

                sendToAllClients({
                    type: 'video-state',
                    currentTime: video.currentTime,
                    paused: video.paused
                });
            }

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            video.addEventListener('loadedmetadata', () => {
                duration.textContent = formatTime(video.duration);
                progressRange.max = video.duration;
            });

            video.addEventListener('timeupdate', () => {
                currentTime.textContent = formatTime(video.currentTime);

                if (!progressRange.classList.contains('seeking')) {
                    progressRange.value = video.currentTime;
                }
            });

            progressRange.addEventListener('input', () => {
                progressRange.classList.add('seeking');
                video.currentTime = progressRange.value;
            });

            progressRange.addEventListener('change', () => {
                progressRange.classList.remove('seeking');
            });

            video.addEventListener('play', () => {
                playIcons.forEach(icon => icon.classList.add('hidden'));
                pauseIcons.forEach(icon => icon.classList.remove('hidden'));
                sendVideoState();
            });

            video.addEventListener('pause', () => {
                playIcons.forEach(icon => icon.classList.remove('hidden'));
                pauseIcons.forEach(icon => icon.classList.add('hidden'));
                sendVideoState();
            });

            video.addEventListener('seeked', sendVideoState);

            function createPeer(id = null) {
                return new Promise((resolve) => {
                    const newInstance = id ? new Peer(id) : new Peer();
                    newInstance.on('open', () => resolve(newInstance));
                });
            }

            let audioCtx = null;

            function unlockAudioContextOnGesture() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                // Buffer silencioso WebAudio
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);

                // Desbloqueia permissão de Autoplay de tags <audio> no Safari iOS
                const silentAudio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==');
                silentAudio.play().catch(() => { });
            }

            const unlockHostAudio = () => {
                initAudioSystem();
                unlockAudioContextOnGesture();
            };
            document.body.addEventListener('touchstart', unlockHostAudio, { once: true });
            document.body.addEventListener('click', unlockHostAudio, { once: true });

            function setupAudioCall(call) {
                if (!activeCalls.some(c => c.peer === call.peer)) {
                    activeCalls.push(call);
                }

                call.on('stream', (remoteStream) => {
                    initAudioSystem();
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }

                    let remoteAudio = document.getElementById(`audio-${call.peer}`);
                    if (!remoteAudio) {
                        remoteAudio = document.createElement('audio');
                        remoteAudio.id = `audio-${call.peer}`;
                        remoteAudio.setAttribute('playsinline', '');
                        remoteAudio.setAttribute('webkit-playsinline', '');
                        remoteAudio.autoplay = true;
                        remoteAudio.style.display = 'none';
                        document.body.appendChild(remoteAudio);
                    }

                    remoteAudio.srcObject = remoteStream;
                    remoteAudio.muted = false; // OBRIGATÓRIO no iOS para a WebKit não congelar a faixa WebRTC

                    // Conecta o áudio recebido direto no AudioContext (placa de som)
                    if (audioCtx) {
                        try {
                            const source = audioCtx.createMediaStreamSource(remoteStream);
                            source.connect(audioCtx.destination);
                        } catch (err) {
                            console.error("Erro no AudioContext source:", err);
                        }
                    }

                    // Tenta a reprodução direta na tag HTML
                    const playPromise = remoteAudio.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => {
                            // Fallback: se o iOS do Host bloquear por falta de toque recente na tela, 
                            // força a reprodução no primeiro toque que o Host der na página
                            const unlockOnTouch = () => {
                                remoteAudio.play();
                                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                            };
                            document.body.addEventListener('touchstart', unlockOnTouch, { once: true });
                            document.body.addEventListener('click', unlockOnTouch, { once: true });
                        });
                    }
                });

                call.on('close', () => {
                    activeCalls = activeCalls.filter(c => c.peer !== call.peer);
                    const remoteAudio = document.getElementById(`audio-${call.peer}`);
                    if (remoteAudio) remoteAudio.remove();
                });
            }

            async function initAsClient() {
                peer = await createPeer();
                conn = peer.connect(roomId, { reliable: true });

                conn.on('open', () => {
                    setupDataFlow(conn);
                    statusBadge.classList.remove('hidden');
                    conn.send({ type: 'join-room', username: username });

                    setInterval(() => {
                        if (conn?.open) {
                            conn.send({ type: 'ping' });
                        }
                    }, 10000);
                });

                window.addEventListener('beforeunload', () => {
                    conn.close();
                });

                peer.on('call', (call) => {
                    initAudioSystem();

                    // Envia o mic real se ativado ou o stream silencioso para manter o canal aberto
                    const streamToSend = (localStream && localStream.getAudioTracks()[0]?.enabled)
                        ? localStream
                        : silentStream;

                    call.answer(streamToSend);
                    setupAudioCall(call);
                });

                conn.on('close', () => {
                    errorMessage.innerText = "A conexão com o Host foi encerrada.";
                    errorModal.classList.remove('hidden');
                });

                peer.on('error', (err) => {
                    if (err.type === 'peer-unavailable') {
                        peer.destroy();
                        errorMessage.innerText = "Host indisponível.";
                        errorModal.classList.remove('hidden');
                    }
                });
            }

            async function initAsHost() {
                try {
                    peer = await createPeer(roomId);
                    isHost = true;
                    onlineCountEl.textContent = `1 Online`;
                    statusBadge.classList.remove('hidden');
                    playPauseBtn.classList.remove('hidden');
                    progressRange.classList.remove('hidden');

                    setInterval(() => {
                        const now = Date.now();
                        clientsConn = clientsConn.filter(clientConn => {
                            if (now - (clientConn.lastPing || 0) > 30000) {
                                try { clientConn.close(); } catch { }
                                return false;
                            }
                            return true;
                        });
                        updateRoomCount();
                    }, 5000);
                } catch (err) {
                    console.error("Erro ao abrir sala como Host:", err);
                    return;
                }

                peer.on('connection', (clientConn) => {
                    clientConn.lastPing = Date.now();
                    clientsConn.push(clientConn);
                    setupDataFlow(clientConn);

                    clientConn.on('open', () => {
                        updateRoomCount();
                        if (video.src) {
                            clientConn.send({ type: 'video-info', url: video.src, time: video.currentTime, isPaused: video.paused });
                        }

                        // Se o Host já estiver com o microfone ligado, liga para o cliente que acabou de entrar
                        if (localStream && localStream.getAudioTracks()[0]?.enabled) {
                            if (!activeCalls.some(c => c.peer === clientConn.peer)) {
                                const call = peer.call(clientConn.peer, localStream);
                                setupAudioCall(call);
                            }
                        }
                    });

                    clientConn.on('close', () => {
                        clientsConn = clientsConn.filter(c => c.peer !== clientConn.peer);
                        updateRoomCount();
                    });

                    clientConn.on('error', () => {
                        clientsConn = clientsConn.filter(c => c.peer !== clientConn.peer);
                        updateRoomCount();
                    });

                    clientConn.peerConnection.onconnectionstatechange = () => {
                        if (
                            clientConn.peerConnection.connectionState === "failed" ||
                            clientConn.peerConnection.connectionState === "closed" ||
                            clientConn.peerConnection.connectionState === "disconnected"
                        ) {
                            clientsConn = clientsConn.filter(c => c.peer !== clientConn.peer);
                            updateRoomCount();
                        }
                    };
                });

                peer.on('call', (call) => {
                    initAudioSystem();

                    // Envia o mic real se ativado ou o stream silencioso para manter o canal aberto
                    const streamToSend = (localStream && localStream.getAudioTracks()[0]?.enabled)
                        ? localStream
                        : silentStream;

                    call.answer(streamToSend);
                    setupAudioCall(call);
                });

                peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') console.error("ID de sala já ocupado!");
                });
            }

            // --- 3. PROCESSAMENTO DE DADOS (DADOS E FEEDBACKS DE DOWNLOAD) ---
            function setupDataFlow(connection) {
                connection.on('data', (data) => {

                    // ==========================================
                    // A. RECEBIMENTO DE BINÁRIO PURO (CHUNKS DO VÍDEO)
                    // ==========================================
                    if (data instanceof ArrayBuffer || data.byteLength !== undefined) {
                        if (receivedChunks && incomingMeta) {
                            receivedChunks.push(data);
                            receivedBytes += data.byteLength;

                            const percent = Math.min(100, Math.floor((receivedBytes / incomingMeta.size) * 100));
                            transferBar.style.width = `${percent}%`;
                            transferPercent.textContent = `${percent}%`;

                            // Envia feedback de progresso ao Host a cada alteração de %
                            if (connection.lastReportedPercent !== percent) {
                                connection.lastReportedPercent = percent;
                                connection.send({ type: 'client-download-progress', percent });
                            }

                            // DOWNLOAD CONCLUÍDO (Atingiu o tamanho total enviado pelo 'video-meta')
                            if (receivedBytes >= incomingMeta.size) {
                                const videoBlob = new Blob(receivedChunks, { type: incomingMeta.mimeType });
                                const localVideoUrl = URL.createObjectURL(videoBlob);

                                video.src = localVideoUrl;
                                video.load();

                                // Avisa o Host que o download terminou
                                connection.send({ type: 'client-download-complete' });

                                // Reseta variáveis de controle
                                receivedChunks = [];
                                incomingMeta = null;
                                receivedBytes = 0;

                                setTimeout(() => {
                                    transferOverlay.classList.add('hidden');
                                }, 800);
                            }
                        }
                        return;
                    }

                    // ==========================================
                    // B. MENSAGENS DE CONTROLE E CHAT (OBJETOS JSON)
                    // ==========================================
                    if (!data?.type) return;

                    if (data.type === 'ping') {
                        connection.lastPing = Date.now();
                        return;
                    }

                    // 1. FEEDBACKS RECEBIDOS PELO HOST
                    if (isHost) {
                        if (data.type === 'client-download-progress') {
                            if (clientProgressState[connection.peer]) {
                                clientProgressState[connection.peer].percent = data.percent;
                                const bar = document.getElementById(`client-bar-${connection.peer}`);
                                const percentText = document.getElementById(`client-percent-${connection.peer}`);
                                if (bar) bar.style.width = `${data.percent}%`;
                                if (percentText) percentText.textContent = `${data.percent}%`;
                            }
                            return;
                        }

                        if (data.type === 'client-download-complete') {
                            if (clientProgressState[connection.peer]) {
                                clientProgressState[connection.peer].percent = 100;
                                clientProgressState[connection.peer].done = true;

                                const bar = document.getElementById(`client-bar-${connection.peer}`);
                                const percentText = document.getElementById(`client-percent-${connection.peer}`);
                                if (bar) bar.style.width = `100%`;
                                if (percentText) percentText.textContent = `100%`;

                                checkAllClientsFinished();
                            }
                            return;
                        }
                    }

                    // 2. RECEBIMENTO DE METADADOS NO CLIENTE
                    if (data.type === 'video-meta') {
                        incomingMeta = data;
                        receivedChunks = [];
                        receivedBytes = 0;

                        localProgressTitle.textContent = "Seu Download";
                        hostClientsProgressSection.classList.add('hidden');
                        transferTitle.textContent = `Recebendo "${data.name}"...`;
                        transferBar.style.width = '0%';
                        transferPercent.textContent = '0%';
                        transferOverlay.classList.remove('hidden');
                        return;
                    }

                    // 3. CHAT E SALA
                    if (data.type === 'join-room') {
                        connection.customUsername = data.username;
                        appendMessage('Sistema', `${data.username} entrou na sala!`);

                        clientsConn.forEach(clientConn => {
                            if (clientConn.peer === connection.peer) return;
                            clientConn.send({
                                type: 'chat-message',
                                sender: 'Sistema',
                                text: `${data.username} entrou na sala.`
                            });
                        });
                        return;
                    }

                    if (data.type === 'chat-message') {
                        appendMessage(data.sender, data.text);

                        if (!conn) {
                            clientsConn.forEach(clientConn => {
                                if (clientConn.peer === connection.peer) return;
                                clientConn.send(data);
                            });
                        }
                        return;
                    }

                    if (isHost && syncWithHost) return;

                    if (data.type === 'room-stats') {
                        onlineCountEl.textContent = `${data.total} Online`;

                        if (data.peers) {
                            // Atualiza a lista de peers da sala (removendo meu próprio ID)
                            const previousPeers = [...roomPeers];
                            roomPeers = data.peers.filter(id => id !== peer.id);

                            // Se eu já estou com o microfone ligado e entrou alguém novo, ligo para ele automaticamente!
                            if (localStream && localStream.getAudioTracks()[0]?.enabled) {
                                roomPeers.forEach(peerId => {
                                    if (!previousPeers.includes(peerId)) {
                                        const call = peer.call(peerId, localStream);
                                        setupAudioCall(call);
                                    }
                                });
                            }
                        }
                        return;
                    }

                    // 4. PLAYER & YOUTUBE
                    if (data.type === 'video-info') {
                        if (data.provider === 'youtube') {
                            carregarPlayerYouTube(data.id);
                        } else {
                            if (video.src !== data.url) {
                                video.src = data.url;
                                video.load();
                            }
                            video.addEventListener('loadedmetadata', () => {
                                video.currentTime = data.time;
                                if (!data.isPaused) {
                                    video.play().catch(console.error);
                                }
                            }, { once: true });
                        }
                        return;
                    }

                    if (data.type === 'video-changed') {
                        if (data.provider === 'youtube') {
                            carregarPlayerYouTube(data.id);
                        } else {
                            if (video.src !== data.url) {
                                video.src = data.url;
                                video.load();
                            }
                        }
                        return;
                    }

                    if (data.type === 'video-state') {
                        const diff = Math.abs(video.currentTime - data.currentTime);

                        if (diff > 0.5) {
                            video.currentTime = data.currentTime;
                        }

                        if (data.paused) {
                            if (!video.paused) video.pause();
                        } else {
                            if (video.paused) video.play().catch(console.error);
                        }
                        return;
                    }
                });
            }

            function checkAllClientsFinished() {
                const peers = Object.keys(clientProgressState);
                if (peers.length === 0) return;

                const allDone = peers.every(peerId => clientProgressState[peerId].done);
                if (allDone) {
                    allCompletedMsg.classList.remove('hidden');

                    setTimeout(() => {
                        transferOverlay.classList.add('hidden');
                    }, 2500);
                }
            }

            // Variável global para armazenar todos os participantes da sala
            let roomPeers = [];

            function updateRoomCount() {
                clientsConn = clientsConn.filter(c => c.open);
                const totalUsers = clientsConn.length + 1;
                onlineCountEl.textContent = `${totalUsers} Online`;

                // Cria a lista com o ID do Host + ID de todos os clientes
                const allPeers = [peer.id, ...clientsConn.map(c => c.peer)];
                sendToAllClients({ type: 'room-stats', total: totalUsers, peers: allPeers });
            }

            function sendToAllClients(data) {
                clientsConn.forEach(clientConn => {
                    if (clientConn.open) {
                        clientConn.send(data);
                    }
                });
            }

            var player;
            function inicializarPlayerYouTube(videoId) {
                if (player) {
                    player.destroy();
                }

                player = new YT.Player('main-video', {
                    height: '100%',
                    width: '100%',
                    videoId: videoId,
                    playerVars: {
                        'playsinline': 1,
                        'controls': 0
                    },
                    events: {
                        'onError': onYouTubePlayerError
                    }
                });
            }

            function onYouTubePlayerError(event) {
                // 101 e 150: O proprietário desativou a reprodução incorporada
                if (event.data === 101 || event.data === 150) {
                    errorMessage.innerText = "Este vídeo possui restrições de direitos autorais e não permite reprodução fora do site do YouTube. Tente usar um envio não-oficial ou outro link.";
                    errorModal.classList.remove('hidden');
                }
                else if (event.data === 2) {
                    errorMessage.innerText = "ID do vídeo do YouTube é inválido.";
                    errorModal.classList.remove('hidden');
                }
                else if (event.data === 100) {
                    errorMessage.innerText = "O vídeo do YouTube não foi encontrado ou é privado.";
                    errorModal.classList.remove('hidden');
                }
            }

            function getYouTubeId(url) {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? match[2] : null;
            }
        });
    </script>
